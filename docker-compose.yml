services:
  back-end:
    build:
      context: .
      dockerfile: apps/back-end/Dockerfile
      target: dev
    container_name: b24-pt-back-end
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-appdb}
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-apppass}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
    expose:
      - "3000"
    volumes:
      # Source only — node_modules lives in the image (see Dockerfile), so it is
      # never shadowed and `docker compose up --build` reinstalls deps cleanly.
      - ./apps/back-end/src:/app/apps/back-end/src
      - ./packages/contracts/src:/app/packages/contracts/src
    depends_on:
      postgres:
        condition: service_healthy
      dbmate:
        condition: service_completed_successfully
    networks:
      - internal
      - forge-network
    restart: no

  dbmate:
    image: amacneil/dbmate:2.33.0
    container_name: b24-pt-dbmate
    command: ["--wait", "up"]
    environment:
      DATABASE_URL: postgres://${DB_USER:-appuser}:${DB_PASSWORD:-apppass}@postgres:5432/${DB_NAME:-appdb}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: no

  front-end:
    build:
      context: .
      dockerfile: apps/front-end/Dockerfile
      target: dev
    container_name: b24-pt-front-end
    environment:
      API_URL: ${API_URL:-http://back-end:3000}
      VITE_APP_URL: ${VITE_APP_URL:-https://b24-cashflow.directadv.gay}
    expose:
      - "5173"
    volumes:
      # Source only — node_modules lives in the image (see Dockerfile), so it is
      # never shadowed and `docker compose up --build` reinstalls deps cleanly.
      - ./apps/front-end/src:/app/apps/front-end/src
      - ./apps/front-end/index.html:/app/apps/front-end/index.html
      - ./apps/front-end/public:/app/apps/front-end/public
      - ./packages/bitrix/src:/app/packages/bitrix/src
      - ./packages/contracts/src:/app/packages/contracts/src
    depends_on:
      - back-end
    networks:
      - internal
      - forge-network
    restart: no

  postgres:
    image: postgres:17-alpine
    container_name: b24-pt-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-appdb}
      POSTGRES_USER: ${DB_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-apppass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-appuser} -d ${DB_NAME:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: no

