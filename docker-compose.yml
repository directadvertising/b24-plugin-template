services:
  back-end:
    build:
      context: .
      dockerfile: apps/back-end/Dockerfile
      target: dev
    container_name: b24-back-end
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-appdb}
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-apppass}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
    expose:
      - "3000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - forge-network
    restart: no

  front-end:
    build:
      context: .
      dockerfile: apps/front-end/Dockerfile
      target: dev
    container_name: b24-front-end
    environment:
      API_URL: ${API_URL:-http://back-end:3000}
    expose:
      - "5173"
    volumes:
      - .:/app
    depends_on:
      - back-end
    networks:
      - internal
      - forge-network
    restart: no

  postgres:
    image: postgres:17-alpine
    container_name: b24-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-appdb}
      POSTGRES_USER: ${DB_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-apppass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-appuser} -d ${DB_NAME:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: no

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: b24-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-queue_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-queue_password}
    expose:
      - "5672"
      - "15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: no

  minio:
    image: minio/minio:latest
    container_name: b24-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
      - forge-network
    restart: no

volumes:
  pgdata:
  rabbitmq_data:
  minio_data:

networks:
  internal:
  forge-network:
    external: true
