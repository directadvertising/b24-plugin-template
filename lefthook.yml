pre-commit:
  parallel: true
  commands:
    "Lint":
      glob: "*.{js,ts,tsx,md,css}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    "Syncpack":
      run: pnpm syncpack fix
      glob: "**/package.json"
      fail_text: "Syncpack automatic fix failed. Please run 'pnpm syncpack lint' to see the issues."
      stage_fixed: true
commit-msg:
  commands:
    "Commit message":
      run: npx commitlint --edit
